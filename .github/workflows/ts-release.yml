# Copyright 2026 Query Farm LLC - https://query.farm
#
# Reusable workflow: compile a TypeScript / Bun VGI worker into a standalone
# single-file executable for every supported platform and attach the archives
# (+ SHA256 + keyless cosign signature + SLSA provenance) to the GitHub Release
# for a vX.Y.Z tag. The TypeScript analogue of rust-release.yml / go-release.yml.
#
# Unlike the Rust/Go workflows, no native-runner matrix is needed: Bun
# cross-compiles every target from a single ubuntu runner via
# `bun build --compile --target=bun-<os>-<arch>` (it downloads the matching
# prebuilt Bun runtime and embeds it + the bundled app into one executable). The
# result is a self-contained binary that DuckDB ATTACHes directly — no Bun, no
# node_modules on the target host. Assets are named
# <asset_prefix>-<tag>-<duckdb_platform>.tar.gz on every platform, plus a .zip
# for windows_* (the binary is <bin>.exe inside) — the layout the vgi extension's
# `github-auto://owner/repo@tag` transport resolves with no #path= fragment.
# (Bun's linux runtimes need only glibc 2.17.) Each archive is cosign
# sign-blob'd into a .cosign.bundle and SLSA build-provenance attested.
#
# Signing runs HERE, so the keyless identity is this workflow
# (Query-farm/vgi-actions/.github/workflows/ts-release.yml). workflow_call-only;
# the CALLER gates on its own test suite. See README.md.
name: ts-release (reusable)

on:
  workflow_call:
    inputs:
      entry:
        description: The worker entry point to compile (the file that calls Worker.run()).
        type: string
        default: "src/worker.ts"
      bin:
        description: Output binary name (the executable inside each archive). Defaults to the repo name.
        type: string
        default: ""
      asset_prefix:
        description: Archive base-name prefix. Defaults to the repository name.
        type: string
        default: ""
      version_check_cmd:
        description: >-
          Command run on a version-tag push with the tag appended as $1, to
          assert the tag matches the worker version. Empty = skip.
        type: string
        default: ""
      bun_build_args:
        description: >-
          Extra flags appended to `bun build --compile` (e.g. "--minify" or
          "--define PACKAGE_VERSION='\"${TAG}\"'"). ${TAG} -> the release tag.
        type: string
        default: ""
      bun-version:
        description: Bun version for oven-sh/setup-bun.
        type: string
        default: "latest"
      include:
        description: Comma-separated extra files to include in each archive.
        type: string
        default: "README.md,LICENSE"

permissions:
  contents: read

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Verify tag matches worker version
        if: inputs.version_check_cmd != ''
        run: ${{ inputs.version_check_cmd }} "${GITHUB_REF_NAME}"
      - name: Create the GitHub Release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  upload:
    name: ${{ matrix.platform }}
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ASSET_PREFIX: ${{ inputs.asset_prefix || github.event.repository.name }}
      BIN: ${{ inputs.bin || github.event.repository.name }}
      PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Every leg cross-compiles on ubuntu; `target` selects the embedded Bun
        # runtime. `platform` is the DuckDB platform name used in the asset name.
        # No osx_amd64: DuckDB 2.0 / haybarn 2.0 dropped macOS on Intel.
        include:
          - { target: bun-linux-x64,     platform: linux_amd64 }
          - { target: bun-linux-arm64,   platform: linux_arm64 }
          - { target: bun-darwin-arm64,  platform: osx_arm64 }
          - { target: bun-windows-x64,   platform: windows_amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT="${BIN}${{ matrix.ext }}"
          EXTRA="${{ inputs.bun_build_args }}"
          EXTRA="${EXTRA//\$\{TAG\}/$TAG}"

          echo "::group::compile ${{ matrix.target }} -> ${OUT}"
          bun build "${{ inputs.entry }}" --compile --target="${{ matrix.target }}" $EXTRA --outfile "$OUT"
          echo "::endgroup::"
          test -s "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Package in the layout the vgi extension's github-auto:// transport
      # expects (see vgi docs/github-transport.md):
      #   <prefix>-<tag>-<platform>.tar.gz — every platform; the worker is the ONLY
      #     exec-bit member at the archive root (README/LICENSE forced to 0644),
      #     so github-auto picks it with no #path= fragment.
      #   <prefix>-<tag>-<platform>.zip    — windows_* only (github-auto fetches
      #     .zip on Windows); <bin>.exe is the only .exe member.
      #   <prefix>-<tag>-<platform>.sha256 — sha256sum lines for the archive(s).
      #     github-auto reads the FIRST digest in it, so on Windows the .zip line
      #     comes first; `sha256sum -c` still verifies every archive.
      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          STEM="${ASSET_PREFIX}-${GITHUB_REF_NAME}-${PLATFORM}"
          STAGE=".vgi-pkg-stage"   # workspace-relative: Windows-safe for msys tar + native 7z
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          NAME="$(basename "$OUT")"
          cp "$OUT" "$STAGE/$NAME"; chmod 0755 "$STAGE/$NAME"
          FILES=("$NAME")
          IFS=',' read -ra INC <<< "${{ inputs.include }}"
          for f in "${INC[@]}"; do
            f="${f// /}"
            if [ -n "$f" ] && [ -f "$f" ]; then
              cp "$f" "$STAGE/$(basename "$f")"; chmod 0644 "$STAGE/$(basename "$f")"; FILES+=("$(basename "$f")")
            fi
          done
          ARCHIVES=()
          if [[ "$PLATFORM" == windows_* ]]; then
            if command -v 7z >/dev/null; then (cd "$STAGE" && 7z a -tzip -bd "../${STEM}.zip" "${FILES[@]}" >/dev/null); else (cd "$STAGE" && zip -q -X "../${STEM}.zip" "${FILES[@]}"); fi
            ARCHIVES+=("${STEM}.zip")
          fi
          COPYFILE_DISABLE=1 tar -C "$STAGE" -czf "${STEM}.tar.gz" "${FILES[@]}"
          ARCHIVES+=("${STEM}.tar.gz")
          if command -v sha256sum >/dev/null; then sha256sum "${ARCHIVES[@]}"; else shasum -a 256 "${ARCHIVES[@]}"; fi > "${STEM}.sha256"
          cat "${STEM}.sha256"
          tar -tvzf "${STEM}.tar.gz"
          echo "archives=${ARCHIVES[*]}" >> "$GITHUB_OUTPUT"
          { echo "subjects<<EOF"; printf '%s\n' "${ARCHIVES[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "sidecar=${STEM}.sha256" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless sigstore signature for each archive, mirroring docker-publish's
      # `cosign sign`. Writes a self-contained .cosign.bundle (signature + cert +
      # Rekor entry) per archive; everything is attached to the Release.
      - name: Sign + upload archives, checksum, bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD=("${{ steps.pkg.outputs.sidecar }}")
          for f in ${{ steps.pkg.outputs.archives }}; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
            UPLOAD+=("$f" "${f}.cosign.bundle")
          done
          gh release upload "${GITHUB_REF_NAME}" "${UPLOAD[@]}" --clobber

      # SLSA build-provenance attestation for the archive(s) — keyless/sigstore,
      # stored in GitHub's attestation API (verify with `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.subjects }}
