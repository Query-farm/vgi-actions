# Copyright 2026 Query Farm LLC - https://query.farm
#
# Reusable workflow: build a binary-driven VGI worker for every supported
# platform and attach the archives (+ SHA256 + keyless cosign signature + SLSA
# build-provenance) to the GitHub Release for a vX.Y.Z tag. This is the on-host
# distribution path — the vgi client downloads, unpacks, and runs the binary
# directly as a DuckDB vgi LOCATION. (The container image — docker-publish.yml —
# is the server/Fly.io path.)
#
# Standardized for binary-driven (Rust) workers:
#   - one .tar.gz per DuckDB platform name (duckdb_platform(): linux_amd64,
#     linux_arm64, osx_arm64, windows_amd64), named
#     <asset_prefix>-<tag>-<duckdb_platform>.tar.gz, plus a .zip for windows_*
#     and a <asset_prefix>-<tag>-<duckdb_platform>.sha256 sidecar — exactly the
#     layout the vgi extension's `github-auto://owner/repo@tag` transport
#     resolves (it fetches .zip on Windows, .tar.gz elsewhere, and runs the
#     single exec-bit / .exe member), so no #path= fragment is needed.
#   - Linux binaries are built with cargo-zigbuild against glibc 2.28, so they
#     run on RHEL/Amazon Linux/Debian-era hosts, not just the runner's glibc.
#   - macOS builds on a current Apple-Silicon runner (macos-15). No osx_amd64:
#     DuckDB 2.0 / haybarn 2.0 dropped macOS on Intel, so nothing could load it.
#     Every target builds native.
#   - each archive is cosign sign-blob'd (keyless: Fulcio cert + Rekor log, no
#     stored key) into a self-contained .cosign.bundle attached next to it, and
#     SLSA build-provenance is attested.
#
# Because signing runs HERE, the keyless cert identity (and provenance builder)
# is this workflow — Query-farm/vgi-actions/.github/workflows/rust-release.yml
# — not the caller's release.yml, matching how docker-publish.yml signs images.
# See README.md for the verify recipe.
#
# workflow_call-only. The CALLER triggers on tags (+ optional dispatch) and is
# responsible for gating on its own test suite — run the repo's ci.yml as a
# `needs:` job before the job that calls this. Tag context (vX.Y.Z) is read from
# the caller's github context.
name: rust-release (reusable)

on:
  workflow_call:
    inputs:
      bin:
        description: Cargo bin name to build and package (the executable inside each archive).
        required: true
        type: string
      asset_prefix:
        description: >-
          Archive base-name prefix, e.g. `vgi-units` ->
          vgi-units-<tag>-<platform>.tar.gz. Defaults to the repository name.
        type: string
        default: ""
      version_check_cmd:
        description: >-
          Command run on a version-tag push with the tag appended as $1 (e.g.
          `ci/check-version.sh`), to assert the tag matches the package version.
          Empty = skip.
        type: string
        default: ""
      include:
        description: Comma-separated extra files to include in each archive.
        type: string
        default: "README.md,LICENSE"
      wasm_runtime_version:
        description: >-
          @query-farm/vgi-worker-runtime version whose SAB ring lib/pre/boot the
          wasm build links (fetched from jsdelivr). Only used when wasm/build.sh
          exists.
        type: string
        default: "0.1.0"
      wasm_emsdk_version:
        description: emsdk version for the wasm build (only used when wasm/build.sh exists).
        type: string
        default: "5.0.1"

permissions:
  contents: read

jobs:
  # Verify tag == package version (optional), then create the GitHub Release.
  # taiki-e/upload-rust-binary-action uploads to an EXISTING Release; a tag push
  # alone doesn't create one, so we create it (idempotently) before the matrix.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        if: inputs.version_check_cmd != ''
        run: ${{ inputs.version_check_cmd }} "${GITHUB_REF_NAME}"
      - name: Create the GitHub Release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  upload:
    name: ${{ matrix.platform }}
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write     # upload release assets
      id-token: write     # keyless cosign sign-blob + provenance (sigstore OIDC)
      attestations: write # SLSA build-provenance attestation
    env:
      # Default the asset prefix to the repo name (input defaults can't use
      # contexts, so the fallback lives here).
      ASSET_PREFIX: ${{ inputs.asset_prefix || github.event.repository.name }}
      BIN: ${{ inputs.bin }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      # Harden cargo's crate downloads against transient CDN connection resets
      # (curl 56 / OpenSSL "unexpected eof" mid-download): retry more, and drop
      # HTTP/2 multiplexing — the known workaround for registry connection-reset
      # flakes. Applies to the build step below.
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
    strategy:
      fail-fast: false
      matrix:
        # Linux legs build with cargo-zigbuild against a glibc 2.28 sysroot
        # (`zig_target` = <triple>.2.28), so the binary runs on any glibc >= 2.28
        # (RHEL/Alma/Rocky 8+, Amazon Linux 2023, Debian 10+, Ubuntu 18.10+)
        # instead of only on the runner's own (ubuntu-latest = 26.04) glibc.
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  zig_target: x86_64-unknown-linux-gnu.2.28,  platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.28, platform: linux_arm64 }
          - { os: macos-15,         target: aarch64-apple-darwin,      platform: osx_arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    platform: windows_amd64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cargo-zigbuild + zig (pip wheels: `cargo-zigbuild` pulls `ziglang`).
      # setup-python gives a pip that isn't PEP 668 "externally managed".
      - uses: actions/setup-python@v5
        if: matrix.zig_target != ''
        with:
          python-version: "3.13"
      - name: Install cargo-zigbuild
        if: matrix.zig_target != ''
        run: python -m pip install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.zig_target }}" ]; then
            cargo zigbuild --release --locked --bin "$BIN" --target "${{ matrix.zig_target }}"
          else
            cargo build --release --locked --bin "$BIN" --target "$TARGET"
          fi
          OUT="target/${TARGET}/release/${BIN}${{ matrix.ext }}"
          test -s "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Fail the release if a Linux binary needs a glibc newer than 2.28.
      - name: Check glibc symbol versions (Linux)
        if: matrix.zig_target != ''
        shell: bash
        run: |
          set -euo pipefail
          max=$(objdump -T "$OUT" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "max GLIBC symbol version: ${max:-none}"
          if [ -n "$max" ] && [ "$(printf '%s\n2.28\n' "$max" | sort -V | tail -1)" != "2.28" ]; then
            echo "::error::$OUT requires GLIBC_$max (> 2.28)"; exit 1
          fi

      # Package in the layout the vgi extension's github-auto:// transport
      # expects (see vgi docs/github-transport.md):
      #   <prefix>-<tag>-<platform>.tar.gz — every platform; the worker is the ONLY
      #     exec-bit member at the archive root (README/LICENSE forced to 0644),
      #     so github-auto picks it with no #path= fragment.
      #   <prefix>-<tag>-<platform>.zip    — windows_* only (github-auto fetches
      #     .zip on Windows); <bin>.exe is the only .exe member.
      #   <prefix>-<tag>-<platform>.sha256 — sha256sum lines for the archive(s).
      #     github-auto reads the FIRST digest in it, so on Windows the .zip line
      #     comes first; `sha256sum -c` still verifies every archive.
      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          STEM="${ASSET_PREFIX}-${GITHUB_REF_NAME}-${PLATFORM}"
          STAGE=".vgi-pkg-stage"   # workspace-relative: Windows-safe for msys tar + native 7z
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          NAME="$(basename "$OUT")"
          cp "$OUT" "$STAGE/$NAME"; chmod 0755 "$STAGE/$NAME"
          FILES=("$NAME")
          IFS=',' read -ra INC <<< "${{ inputs.include }}"
          for f in "${INC[@]}"; do
            f="${f// /}"
            if [ -n "$f" ] && [ -f "$f" ]; then
              cp "$f" "$STAGE/$(basename "$f")"; chmod 0644 "$STAGE/$(basename "$f")"; FILES+=("$(basename "$f")")
            fi
          done
          ARCHIVES=()
          if [[ "$PLATFORM" == windows_* ]]; then
            if command -v 7z >/dev/null; then (cd "$STAGE" && 7z a -tzip -bd "../${STEM}.zip" "${FILES[@]}" >/dev/null); else (cd "$STAGE" && zip -q -X "../${STEM}.zip" "${FILES[@]}"); fi
            ARCHIVES+=("${STEM}.zip")
          fi
          COPYFILE_DISABLE=1 tar -C "$STAGE" -czf "${STEM}.tar.gz" "${FILES[@]}"
          ARCHIVES+=("${STEM}.tar.gz")
          if command -v sha256sum >/dev/null; then sha256sum "${ARCHIVES[@]}"; else shasum -a 256 "${ARCHIVES[@]}"; fi > "${STEM}.sha256"
          cat "${STEM}.sha256"
          tar -tvzf "${STEM}.tar.gz"
          echo "archives=${ARCHIVES[*]}" >> "$GITHUB_OUTPUT"
          { echo "subjects<<EOF"; printf '%s\n' "${ARCHIVES[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "sidecar=${STEM}.sha256" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless sigstore signature for each archive, mirroring docker-publish's
      # `cosign sign`. Writes a self-contained .cosign.bundle (signature + cert +
      # Rekor entry) per archive; everything is attached to the Release.
      - name: Sign + upload archives, checksum, bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPLOAD=("${{ steps.pkg.outputs.sidecar }}")
          for f in ${{ steps.pkg.outputs.archives }}; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
            UPLOAD+=("$f" "${f}.cosign.bundle")
          done
          gh release upload "${GITHUB_REF_NAME}" "${UPLOAD[@]}" --clobber

      # SLSA build-provenance attestation for the archive(s) — keyless/sigstore,
      # stored in GitHub's attestation API (verify with `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.subjects }}

  # Browser (wasm32) build — OPT-IN BY FILE PRESENCE: runs only when the repo has
  # a wasm/build.sh (the workers that build to DuckDB-WASM). Others no-op. Emits
  # vgi_worker.{js,wasm} + vgi-worker-boot.js as a signed, attested wasm archive.
  wasm:
    name: wasm32
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload release assets
      id-token: write     # keyless cosign + provenance
      attestations: write
    env:
      ASSET_PREFIX: ${{ inputs.asset_prefix || github.event.repository.name }}
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v4

      # Gate the whole job on wasm/build.sh so this workflow stays safe for Rust
      # workers that do NOT ship a browser build.
      - name: Detect wasm build
        id: detect
        shell: bash
        run: |
          if [ -f wasm/build.sh ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Rust nightly (build-std) + wasm target
        if: steps.detect.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.has == 'true'
        with:
          key: wasm32-emscripten

      - name: Install emsdk
        if: steps.detect.outputs.has == 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.wasm_emsdk_version }}

      - name: Build wasm worker + upload to the Release (signed + attested)
        if: steps.detect.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Shared SAB ring runtime (lib/pre/boot) from the published package — the
          # same three files every browser VGI worker links. No vgi-repo checkout.
          V="${{ inputs.wasm_runtime_version }}"
          base="https://cdn.jsdelivr.net/npm/@query-farm/vgi-worker-runtime@${V}/wasm"
          mkdir -p .vgi-runtime
          for f in vgi_worker_lib.js vgi_worker_pre.js vgi-worker-boot.js; do
            curl -sSfL "$base/$f" -o ".vgi-runtime/$f"
          done
          VGI_WORKER_RUNTIME="$PWD/.vgi-runtime" EMSDK_DIR="$EMSDK" ./wasm/build.sh
          test -s wasm/dist/vgi_worker.wasm

          # Package the browser bundle (module + wasm + boot) like the binary archives.
          arc="${ASSET_PREFIX}-${GITHUB_REF_NAME}-wasm.tar.gz"
          tar -C wasm/dist -czf "$arc" vgi_worker.js vgi_worker.wasm vgi-worker-boot.js
          sha256sum "$arc" > "${arc}.sha256"
          gh release upload "${GITHUB_REF_NAME}" "$arc" "${arc}.sha256" --clobber
          echo "ARCHIVE=$arc" >> "$GITHUB_ENV"

      - name: Install cosign
        if: steps.detect.outputs.has == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign wasm archive (keyless) and attach bundle
        if: steps.detect.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${ARCHIVE}.cosign.bundle" "${ARCHIVE}"
          gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}.cosign.bundle" --clobber

      - name: Attest wasm build provenance
        if: steps.detect.outputs.has == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ARCHIVE }}
